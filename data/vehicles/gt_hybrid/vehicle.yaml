# SPDX-License-Identifier: CC-BY-SA-4.0
# SYNTHETIC reference GT hybrid (D-M6-12) — plausible magnitudes, no measured data anywhere.
#
# Reference topology: GT hybrid 80/20 (ICE -> gearbox -> rear diff -> RL+RR; the MGU-K shares the
# crank node as the ERS machine — the split is data, not code). Same drivetrain shape as f1_2026,
# different numbers: a 1250 kg mid-engined car on moderate downforce, a 6-speed box, and a 2.0 MJ /
# 120 kW energy-management policy instead of the FIA 2026 4.0 MJ / 350 kW rulebook.
#
# This car is also the repo's OPTION-COVERAGE reference: it deliberately declares NO `fuel:` block,
# NO `policy.override_mode`, NO `policy.recovery.recharge_phases`, NO `policy.max_engine_speed_rpm`
# and NO `thermal:` `.emotor` on the MGU-K. That absence is the point — it keeps the absent-Option
# paths exercised end-to-end on a real, runnable car (D-M6-12). Do not "complete" the car.
#
# The `.ptm` maps and the `.tyr` are copies of the f1_2026 ones (identical numbers, gt-specific
# provenance headers), so the combustion source is a ~500 kW-class synthetic V6 and the tyre is an
# F1-calibrated slick: this is a topology/Option reference, NOT a performance model of any real GT
# class. Per-parameter provenance: data/vehicles/README.md.
schema: vehicle/2.1
name: "Reference GT hybrid"
chassis:
  mass_kg: 1250.0
  cg: [1.55, 0.0, 0.34]
  inertia: [320.0, 1600.0, 1750.0]
  wheelbase_m: 2.75
  track_m: [1.68, 1.64]
aero:
  # SYNTHETIC constant-coefficient aero (Locked Decision #15). No ride-height/yaw map is shipped for
  # this car — the placeholder path is deliberately absent (the repo idiom, as on bmw320i /
  # tesla_model3_rwd / limebeer_2014_f1), so the constant block carries every tier.
  #   CxA  1.10 m² ~ Cd 0.58 x A 1.90 m² (closed GT body).
  #   CzA  0.99 + 1.36 = 2.35 m² -> 6.9 kN at 250 km/h ~ 0.57x car weight — a moderate-downforce GT,
  #        far below the f1_2026 car's ~2.1x, and an L/D of ~2.1.
  #   Aero balance 42 % front sits just behind the 44 % front static mass split (cg 1.55 m of a
  #        2.75 m wheelbase), so the platform migrates mildly understeering with speed.
  map: aero/none.parquet
  axes: []
  constant:
    cx_a_m2: 1.10
    cz_front_a_m2: 0.99
    cz_rear_a_m2: 1.36
suspension:
  model: lumped_kc
  front: { ride_rate_n_per_m: 130000.0, roll_stiffness_share: 0.56, roll_center_height_m: 0.04 }
  rear: { ride_rate_n_per_m: 140000.0, roll_stiffness_share: 0.44, roll_center_height_m: 0.07 }
tires:
  front: tyr/slick.tyr.yaml
  rear: tyr/slick.tyr.yaml
drivetrain:
  # D-M6-13 graph shape (mirrors f1_2026): ICE + MGU-K share the crank node; gearbox + diff on
  # top-level couplers. The MGU-K is governed by `policy` and force-added, so it is excluded from
  # the mechanical ceilings.
  units:
    - id: ice
      source: ptm/ice_v6.ptm.yaml
      output: crank
    - id: mguk
      source: ptm/mgu_k.ptm.yaml
      battery: gt_es
      output: crank
  couplers:
    - coupler:
        gearbox: { ratios: [2.6, 2.0, 1.6, 1.3, 1.1, 0.9], final_drive: 3.4, shift_time_s: 0.04 }
      from: crank
      to: gearbox_out
    - coupler:
        diff: { type: lsd, preload_nm: 80.0, ramp: [40.0, 65.0] }
      from: gearbox_out
      wheels: [RL, RR]
policy:
  # Exercises the OPTIONAL policy paths: no override_mode, no recharge_phases, no rev limit —
  # proving the Option-handling stays tested on a shipped car (D-M6-12). A privately-regulated GT
  # series: a 2.0 MJ on-track swing (which is exactly the gt_es pack's usable window) and a 120 kW
  # machine held under a decreasing speed taper.
  governs: [mguk]
  regulatory_window_mj: 2.0
  deployment:
    power_limit_kw: 120.0
    taper_vs_speed:
      speed_kph: [0.0, 250.0, 320.0]
      power_frac: [1.0, 0.8, 0.0]
  recovery:
    braking_power_limit_kw: 120.0
    per_lap_harvest_mj: 3.0
batteries:
  gt_es:
    model: rc_pairs
    params: battery/gt_es.yaml
brakes:
  balance_bar: 0.6
  disc:
    front: { thermal_capacity_j_per_k: 52000.0, cooling_area_m2: 0.13 }
    rear: { thermal_capacity_j_per_k: 40000.0, cooling_area_m2: 0.10 }
  regen_blend: { max_regen_frac: 0.45 }
